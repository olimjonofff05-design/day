<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ritm">
<meta name="theme-color" content="#0b110f">
<title>Ritm — kun tartibim</title>
<link rel="apple-touch-icon" id="touchIcon" href="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0b110f; --deep:#111a17; --panel:#17231f; --panel2:#1e2c27;
  --line:rgba(232,218,184,.10); --sand:#efe6d2; --mist:#a8ad9c; --dim:#6b7364;
  --sun:#d4af6a; --sun2:#ecd49c; --sky:#86b4c4; --lilac:#c49bbb; --teal:#5fbf95; --rose:#d4806c;
  --font:"Manrope", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; --serif:"Fraunces", Georgia, "Times New Roman", serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit;margin:0;padding:0}
html{background:var(--night);scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{background:var(--night);color:var(--sand);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100%;overflow-x:hidden}
body::before{content:"";position:fixed;left:50%;top:-180px;width:720px;height:520px;transform:translateX(-50%);
  background:radial-gradient(closest-side,rgba(212,175,106,.16),rgba(95,191,149,.06) 55%,transparent);pointer-events:none;z-index:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--sky)}
:focus-visible{outline:2px solid var(--sun);outline-offset:2px;border-radius:8px}
.app{position:relative;z-index:1;max-width:540px;margin:0 auto;padding:14px 16px 140px}

.top{display:flex;justify-content:space-between;align-items:center;padding:6px 2px 4px;gap:10px}
.hello{font-size:15px;color:var(--mist)}
.hello b{color:var(--sand);font-weight:600}
.top-r{display:flex;align-items:center;gap:10px}
.today-date{font-size:13px;color:var(--dim);text-align:right}
.gear{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--deep);display:grid;place-items:center;color:var(--mist)}
.gear.on{color:var(--sun);border-color:rgba(212,175,106,.5)}
.gear svg{width:18px;height:18px}

.dial-wrap{position:relative;width:min(100%,330px);aspect-ratio:1;margin:6px auto 0}
.dial-wrap svg{width:100%;height:100%;display:block}
.dial-center{position:absolute;inset:22%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.dial-clock{font-size:52px;font-weight:700;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.dial-clock span{font-size:18px;color:var(--mist);font-weight:500;margin-left:3px;letter-spacing:0}
.dial-now{margin-top:8px;font-size:15px;font-weight:600;max-width:170px;line-height:1.25}
.dial-left{margin-top:4px;font-size:13px;color:var(--mist);font-variant-numeric:tabular-nums}
.sun-dot{filter:drop-shadow(0 0 8px rgba(236,212,156,.9))}
@keyframes pulse{0%,100%{r:9}50%{r:11}}
.sun-dot circle.core{animation:pulse 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.sun-dot circle.core{animation:none}}

.next-line{display:flex;justify-content:center;gap:8px;align-items:center;margin:2px 0 18px;font-size:14px;color:var(--mist);flex-wrap:wrap;text-align:center}
.next-line b{color:var(--sand);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:var(--panel);border:1px solid var(--line);font-size:13px}
.back-today{background:var(--sun);color:#1d1606;border:0;font-weight:700;padding:8px 14px;border-radius:99px}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:0 0 20px}
.wd{background:transparent;border:1px solid var(--line);border-radius:14px;padding:8px 0 7px;text-align:center;color:var(--mist);font-size:12px;transition:background .2s,border-color .2s;position:relative}
.wd b{display:block;font-size:18px;color:var(--sand);font-weight:600;line-height:1.2;font-variant-numeric:tabular-nums}
.wd i{display:block;width:5px;height:5px;border-radius:50%;margin:4px auto 0;background:var(--dim)}
.wd.off::after{content:"";position:absolute;top:5px;right:6px;width:5px;height:5px;border-radius:50%;background:var(--teal)}
.wd.is-today{border-color:rgba(212,175,106,.55)}
.wd.is-sel{background:var(--sand);color:#3a3340;border-color:var(--sand)}
.wd.is-sel b{color:var(--night)}

.sec{margin:26px 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sec h2{font-size:22px;font-weight:700;letter-spacing:-.02em}
.sec span{font-size:13px;color:var(--mist)}
.box{background:var(--deep);border:1px solid var(--line);border-radius:20px;padding:16px}
.box + .box{margin-top:10px}
.muted{color:var(--mist)}
.small{font-size:13px}
.warn{background:rgba(212,128,108,.1);border:1px solid rgba(212,128,108,.35);color:#f0c3b6;border-radius:14px;padding:10px 12px;font-size:13px;margin-bottom:10px}

.shift{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.shift small{display:block;color:var(--mist);font-size:12px}
.shift b{font-size:18px;font-variant-numeric:tabular-nums}
.tag{display:inline-block;margin-left:8px;font-size:11px;padding:2px 8px;border-radius:99px;background:rgba(134,180,196,.15);color:var(--sky);vertical-align:middle}
.sbtn{padding:9px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-size:13px;font-weight:600;white-space:nowrap}
.shift-edit{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:-2px 0 10px}
.shift-edit label{font-size:12px;color:var(--mist);display:flex;flex-direction:column;gap:4px}
.shift-edit input{padding:9px 10px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-size:15px}
.shift-edit .row{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--deep);border:1px solid var(--line);border-radius:18px;padding:12px}
.stat small{display:block;color:var(--mist);font-size:12px}
.stat b{display:block;font-size:20px;font-weight:700;margin-top:2px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}

.tips{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.tip{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:16px;background:linear-gradient(120deg,rgba(212,175,106,.10),rgba(196,155,187,.06));border:1px solid rgba(212,175,106,.18);font-size:14px}
.tip span{font-size:18px;line-height:1.2}

.hc{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.hc:last-of-type{border-bottom:0}
.hc i{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:800;margin-top:1px}
.hc i.ok{background:rgba(95,191,149,.18);color:var(--teal)}
.hc i.no{background:rgba(212,175,106,.18);color:var(--sun)}
details.why{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
details.why summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--sun2);list-style:none}
details.why summary::-webkit-details-marker{display:none}
details.why p{font-size:14px;color:var(--mist);margin-top:8px}

.tl-item{display:grid;grid-template-columns:50px 1fr 30px;gap:12px;align-items:start;padding:12px 4px 12px 0;position:relative;width:100%;text-align:left;background:none;border:0}
.tl-item::before{content:"";position:absolute;left:62px;top:0;bottom:0;width:2px;background:var(--line)}
.tl-time{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;padding-top:1px}
.tl-time small{display:block;font-size:11px;color:var(--dim);font-weight:500}
.tl-body{position:relative;padding-left:16px;min-width:0}
.tl-body::before{content:"";position:absolute;left:-1px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--c,var(--dim));box-shadow:0 0 0 4px var(--deep)}
.tl-title{font-weight:600;font-size:15px}
.tl-sub{font-size:13px;color:var(--mist);margin-top:2px}
.tl-check{width:26px;height:26px;border-radius:50%;border:2px solid var(--dim);display:grid;place-items:center;margin-top:1px;transition:background .2s,border-color .2s;background:none;flex:none}
.tl-check svg{opacity:0;width:14px;height:14px}
.done > .tl-check,.tl-item.done .tl-check{background:var(--teal);border-color:var(--teal)}
.done > .tl-check svg,.tl-item.done .tl-check svg{opacity:1}
.tl-item.done .tl-title{text-decoration:line-through;text-decoration-color:var(--dim)}
.tl-item.past:not(.done){opacity:.5}
.tl-item.cur{background:linear-gradient(90deg,rgba(212,175,106,.12),transparent 80%);border-radius:14px}
.tl-item.cur .tl-time{color:var(--sun)}
.tl-item.cur .tl-body::before{box-shadow:0 0 0 4px var(--deep),0 0 14px 3px var(--sun);background:var(--sun)}
.tl-bar{height:3px;border-radius:3px;background:var(--line);margin-top:8px;overflow:hidden}
.tl-bar i{display:block;height:100%;background:var(--sun)}

.water{display:flex;align-items:center;gap:12px}
.drops{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.drop{width:24px;height:30px}
.drop svg{width:100%;height:100%}
.round{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font-size:20px;font-weight:600;display:grid;place-items:center;flex:none}

.habit{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border:0;background:none;text-align:left;width:100%;border-bottom:1px solid var(--line)}
.habit:last-child{border-bottom:0}

.gym-hero{border-radius:24px;padding:20px;background:var(--deep);border:1px solid var(--line);position:relative;overflow:hidden}
.gym-hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:var(--gc,var(--sun));opacity:.16;filter:blur(10px)}
.gym-day{font-size:13px;color:var(--mist)}
.gym-name{font-size:40px;font-weight:800;letter-spacing:-.04em;line-height:1;margin:6px 0 4px}
.gym-title{font-size:16px;opacity:.85}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{font-size:12px;padding:4px 10px;border-radius:99px;background:rgba(239,230,210,.07);border:1px solid var(--line)}
.prog{height:6px;border-radius:6px;background:rgba(239,230,210,.08);margin-top:14px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--gc,var(--sun));transition:width .3s}

.ex{border-bottom:1px solid var(--line);padding:14px 0}
.ex:last-child{border-bottom:0}
.ex-top{display:grid;grid-template-columns:104px 1fr 30px;gap:12px;align-items:start}
.fig{width:104px;height:92px;border-radius:14px;background:radial-gradient(circle at 50% 40%,#1c2b25,#111a17);display:block}
.fig.big{width:100%;height:auto;aspect-ratio:200/178;max-height:260px}
.ex-name{font-weight:600;line-height:1.25}
.ex-meta{font-size:13px;color:var(--sun2);margin-top:3px;font-variant-numeric:tabular-nums}
.ex-act{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center}
.ex-act input{width:64px;padding:6px 8px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:14px}
.ex-act small{font-size:12px;color:var(--mist)}
.mini{padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:12px;font-weight:600}
.ex.done .ex-name{text-decoration:line-through;text-decoration-color:var(--dim)}
.how{margin-top:12px;background:var(--panel);border-radius:16px;padding:14px;display:none}
.ex.open .how{display:block}
.how h4{font-size:14px;margin:12px 0 6px}
.how ol,.how ul{padding-left:20px;font-size:14px;color:var(--mist);display:flex;flex-direction:column;gap:5px}
.how ol li::marker{color:var(--sun);font-weight:700}
.how ul li::marker{color:var(--rose)}
.how .yt{display:inline-flex;margin-top:12px;font-size:13px;font-weight:600;color:var(--sun2);text-decoration:none;border:1px solid rgba(236,212,156,.3);padding:7px 12px;border-radius:10px}

.split-row{display:grid;grid-template-columns:46px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.split-row:last-child{border-bottom:0}
.split-row .sw{display:flex;align-items:center;gap:8px}
.split-row .sw i{width:8px;height:8px;border-radius:50%;flex:none}
.split-row.on{color:var(--sun)}
.rules{display:flex;flex-direction:column;gap:10px;font-size:14px}
.rules div{display:flex;gap:10px}
.rules div span{color:var(--sun);font-weight:700}

.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:25;background:var(--sun);color:#1d1606;border-radius:99px;padding:8px 8px 8px 18px;display:none;align-items:center;gap:12px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.timer.on{display:flex}
.timer b{font-size:22px;font-variant-numeric:tabular-nums}
.timer button{border:0;background:rgba(0,0,0,.15);border-radius:99px;padding:6px 12px;font-weight:700;color:#1d1606}

.lesson{border-radius:24px;padding:20px;background:var(--deep);border:1px solid var(--line);position:relative;overflow:hidden}
.lesson + .lesson{margin-top:12px}
.lesson::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--lc)}
.lesson .lh{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--mist)}
.lesson h3{font-size:24px;font-weight:700;letter-spacing:-.03em;line-height:1.15;margin:8px 0 12px}
.lesson ul{padding-left:18px;display:flex;flex-direction:column;gap:8px;font-size:15px}
.lesson ul li::marker{color:var(--lc)}
.task{margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--panel);font-size:14px}
.task b{display:block;font-size:12px;color:var(--lc);margin-bottom:2px}
.lesson .btn{margin-top:14px;width:100%}
.donebadge{display:inline-flex;gap:6px;align-items:center;color:var(--teal);font-weight:700;font-size:13px}
.disc{font-size:12px;color:#f0c3b6;margin-top:10px}
.course{padding:12px 0;border-bottom:1px solid var(--line)}
.course:last-child{border-bottom:0}
.course .ch{display:flex;justify-content:space-between;font-size:14px;font-weight:600}
.course .prog i{background:var(--lc)}
.course details{margin-top:8px}
.course summary{font-size:13px;color:var(--mist);cursor:pointer}
.ll{font-size:13px;padding:7px 0;border-bottom:1px dashed var(--line);display:flex;gap:8px}
.ll:last-child{border-bottom:0}
.ll.d{color:var(--dim);text-decoration:line-through}
.ll.n{color:var(--sun2);font-weight:600}

.bf{border-radius:24px;padding:20px;background:linear-gradient(150deg,#33291a,#17231f 70%);border:1px solid rgba(212,175,106,.22)}
.bf h3{font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1.1;margin:6px 0 8px}
.bf .p{display:inline-block;margin-top:12px;font-size:13px;font-weight:600;color:#1d1606;background:var(--sun2);padding:5px 10px;border-radius:99px}
.meal{display:grid;grid-template-columns:52px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.meal:last-child{border-bottom:0}
.meal .t{font-weight:600;font-variant-numeric:tabular-nums}

.big{font-size:44px;font-weight:800;letter-spacing:-.04em;line-height:1}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.heat div{aspect-ratio:1;border-radius:8px;background:var(--panel)}
.heat div.t{outline:2px solid var(--sun);outline-offset:1px}
.heat-l{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:6px;font-size:11px;color:var(--dim);text-align:center}
.row-in{display:flex;gap:8px;margin-top:12px}
.row-in input{flex:1;min-width:0;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-size:15px}
.btn{padding:12px 16px;border-radius:14px;border:0;background:var(--sun);color:#1d1606;font-weight:700}
.btn.ghost{background:var(--panel);color:var(--sand);border:1px solid var(--line)}
.spark{width:100%;height:110px;margin-top:12px;display:block}

.field{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.field label{font-size:14px}
.field label small{display:block;color:var(--mist);font-size:12px}
.field input{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:15px;width:118px;text-align:right}
.field input[type=text]{width:190px;text-align:left}
.field.col{flex-direction:column;align-items:stretch}
.daypick{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:8px}
.daypick.three{grid-template-columns:repeat(3,1fr)}
.daypick button{padding:9px 0;border-radius:10px;border:1px solid var(--line);background:none;font-size:13px;color:var(--mist)}
.daypick button.on{background:var(--sky);color:var(--night);border-color:var(--sky);font-weight:700}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(11,17,15,.86);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-top:1px solid var(--line)}
.tabs .in{max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{background:none;border:0;color:var(--dim);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0}
.tabs button svg{width:24px;height:24px}
.tabs button.on{color:var(--sun)}
.view{display:none}
.view.on{display:block;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view.on{animation:none}}
.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--sand);color:var(--night);font-weight:600;padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;transition:.25s;z-index:30;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%)}

/* rich theme */
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:radial-gradient(rgba(232,218,184,.05) 1px,transparent 1px);background-size:4px 4px}
.dial-clock,.sec h2,.gym-name,.lesson h3,.bf h3,.big,.stat b,.rank-name,.shift b{font-family:var(--serif);letter-spacing:-.01em}
.dial-clock{font-weight:600}.sec h2{font-weight:600}.gym-name{font-weight:700}
.box,.stat,.lesson,.gym-hero{background:linear-gradient(160deg,rgba(255,255,255,.025),transparent 50%),var(--deep)}
.btn{background:linear-gradient(135deg,#e6c77a,#c39a4c);box-shadow:0 6px 18px rgba(212,175,106,.18)}
.wd.is-sel{background:linear-gradient(135deg,#e6c77a,#c39a4c);border-color:#d4af6a;color:#1d1606}
.rank-card{border-radius:26px;padding:20px;background:radial-gradient(120% 90% at 100% 0%,rgba(212,175,106,.18),transparent 55%),linear-gradient(160deg,#1a2822,#0f1714);border:1px solid rgba(212,175,106,.35);text-align:center;position:relative;overflow:hidden}
.pogon{width:100%;max-width:300px;height:auto;display:block;margin:4px auto 12px;filter:drop-shadow(0 8px 18px rgba(0,0,0,.45))}
.rank-sub{font-size:12px;color:var(--sun2);letter-spacing:.08em}
.rank-name{font-size:30px;font-weight:600;line-height:1.15;margin:4px 0 6px}
.id-row{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mist);margin-bottom:14px}
.id-row b{color:var(--sand)}
.xpbar{height:8px;border-radius:8px;background:rgba(239,230,210,.08);overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#c39a4c,#ecd49c);border-radius:8px}
.xp-row{display:flex;justify-content:space-between;font-size:12px;color:var(--mist);margin-top:6px;gap:8px}
.chal{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}

const pad = n => String(n).padStart(2, "0");
const toMin = t => { const [a, b] = String(t || "0:0").split(":").map(Number); return (a || 0) * 60 + (b || 0); };

const dur = m => { m = Math.max(0, Math.round(m)); const h = Math.floor(m / 60), r = m % 60; return h ? (r ? `${h} soat ${r} daq` : `${h} soat`) : `${r} daq`; };
const dkey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;

/* ================= storage ================= */

  workStart: "11:00", workEnd: "20:00", lunchStart: "15:00", lunchMin: 60, commute: 60,

};
const lerp = (a, b, k) => a.map((v, i) => v + (b[i] - v) * k);
function poseSVG(A, p, p2, tool) {
  const [hx, hy, sx, sy, ex, ey, wx, wy, px, py, kx, ky, ax, ay, tx, ty] = p;
  const so = A.front ? 11 : 0, ho = A.front ? 6 : 0, M = "#efe6d2", Bk = A.front ? M : "rgba(239,230,210,.38)", T = "#d4af6a";
  const pl = (a, c, w) => `<polyline points="${a.map(n => n.toFixed(1)).join(" ")}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
  const tl = (x, y) => tool === "bar" ? `<circle cx="${x}" cy="${y}" r="13" fill="rgba(212,175,106,.18)" stroke="${T}" stroke-width="3"/><circle cx="${x}" cy="${y}" r="2.5" fill="${T}"/>`
    : tool === "db" ? `<rect x="${x - 9}" y="${y - 5}" width="18" height="10" rx="3" fill="${T}"/>`
    : tool === "cable" ? `<circle cx="${x}" cy="${y}" r="4" fill="${T}"/>` : "";
  let s = "";
  if (tool === "cable" && A.anchor) s += `<line x1="${A.anchor[0]}" y1="${A.anchor[1]}" x2="${wx}" y2="${wy}" stroke="${T}" stroke-width="1.6" stroke-dasharray="3 3"/>`;
  if (p2) {
    const [e2x, e2y, w2x, w2y, k2x, k2y, a2x, a2y, t2x, t2y] = p2;
    s += pl([px + ho, py, k2x, k2y, a2x, a2y, t2x, t2y], Bk, 7);
    s += pl([sx + so, sy, e2x, e2y, w2x, w2y], Bk, 6);
    if (A.both) s += tl(w2x, w2y);
  }
  if (A.front) s += pl([sx - so, sy, sx + so, sy], M, 7) + pl([px - ho, py, px + ho, py], M, 7);
  s += pl([sx, sy, px, py], M, 8);
  s += pl([px - ho, py, kx, ky, ax, ay, tx, ty], M, 7);
  s += `<circle cx="${hx}" cy="${hy}" r="9" fill="${M}"/>`;
  s += pl([sx - so, sy, ex, ey, wx, wy], M, 6);

  else s += tl(wx, wy);
  return s;
}
function figHTML(anim, tool, big) {

}
const RM = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
let lastF = 0;
function animLoop(ts) {
  if (ts - lastF > 33) {
    lastF = ts;
    const figs = document.querySelectorAll("svg.fig");
    if (figs.length) {
      const ph = (ts % 2800) / 2800, e = x => x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
      const k = RM ? 1 : ph < .4 ? e(ph / .4) : ph < .55 ? 1 : ph < .95 ? 1 - e((ph - .55) / .4) : 0;
      figs.forEach(f => {
        const A = ANIM[f.dataset.a]; if (!A) return;
        f.querySelector("g.dyn").innerHTML = poseSVG(A, lerp(A.a, A.b, k), A.a2 ? lerp(A.a2, A.b2 || A.a2, k) : null, f.dataset.tool);
      });
    }
  }
  requestAnimationFrame(animLoop);
}

function dayChallenges(k) {
  const d = new Date(k + "T12:00"), w = workoutFor(d.getDay()), seed = d.getDate() * 7 + d.getMonth() * 3;
  const pool = CHALLENGES.filter(c => c[0] !== "gym" || w.ex.length);
  const out = []; let i = seed;
  for (let j = 0; out.length < 3 && j < 40; j++) { const c = pool[(i + j * 5) % pool.length]; if (!out.includes(c)) out.push(c); }
  return out;
}
function dayXP(k) {

    const w = workoutFor(new Date(k + "T12:00").getDay()); if (w.ex.length && w.ex.every(e => D.ex[e.id])) x += 40;

}

function starPath(cx, cy, r) { let p = ""; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .45 : r; p += (i ? "L" : "M") + (cx + rr * Math.cos(a)).toFixed(1) + " " + (cy + rr * Math.sin(a)).toFixed(1); } return p + "Z"; }

  const base = gen ? "#c9a24e" : "#2f3d2c", edge = gen ? "#8a6a24" : "#d4af6a";
  let s = `<svg class="pogon" viewBox="0 0 300 90" aria-hidden="true"><defs><linearGradient id="pg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${gen ? "#e6c77a" : "#3a4a36"}"/><stop offset="1" stop-color="${base}"/></linearGradient></defs>

  if (off) { s += `<rect x="40" y="${senior ? 32 : 42}" width="230" height="5" fill="#d4af6a" opacity=".85"/>`; if (senior) s += `<rect x="40" y="53" width="230" height="5" fill="#d4af6a" opacity=".85"/>`; }
  s += `<circle cx="40" cy="45" r="9" fill="${gen ? "#8a6a24" : "#d4af6a"}"/><circle cx="40" cy="45" r="4" fill="${gen ? "#e6c77a" : "#2f3d2c"}"/>`;
  const gold = gen ? "#5a3f10" : "#e8c97f";
  if (i >= 1 && i <= 3) for (let n = 0; n < i; n++) s += `<rect x="${200 - n * 18}" y="14" width="8" height="62" rx="2" fill="${gold}"/>`;
  if (i === 4) s += `<rect x="186" y="14" width="22" height="62" rx="3" fill="${gold}"/>`;

function timerTick() {
  const el = $("#timer"); if (!tEnd) { el.classList.remove("on"); return; }
  const left = Math.round((tEnd - Date.now()) / 1000);
  if (left <= 0) { tEnd = 0; el.classList.remove("on"); toast("Dam tugadi, keyingi set! 💪"); try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {} return; }
  el.classList.add("on"); $("#timerT").textContent = `${Math.floor(left / 60)}:${pad(left % 60)}`;
}

/* ================= events ================= */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act, k = dkey(sel), D = day(k);
  if (a === "tab") { tab = el.dataset.t; renderTabs(); renderView(); window.scrollTo({ top: 0, behavior: "smooth" }); return; }
  if (a === "sel") { const [y, m, d] = el.dataset.d.split("-").map(Number); sel = new Date(y, m - 1, d, 12); editShift = false; render(); return; }
  if (a === "today") { sel = new Date(); render(); return; }
  if (a === "shiftEdit") { editShift = !editShift; renderToday(); return; }
  if (a === "exOpen") { openEx[el.dataset.id] = !openEx[el.dataset.id]; renderGym(); return; }
  if (a === "rest") { tEnd = Date.now() + restSec(el.dataset.r) * 1000; timerTick(); return; }
  if (a === "tstop") { tEnd = 0; timerTick(); return; }
  if (a === "ovSave") { const s1 = $("#ovS").value, s2 = $("#ovE").value; if (!s1 || !s2 || toMin(s2) <= toMin(s1)) { toast("Vaqtni to'g'ri kiriting"); return; } S.over[k] = { start: s1, end: s2 }; editShift = false; toast("Grafik o'zgartirildi"); }
  if (a === "ovOff") { S.over[k] = { off: true }; editShift = false; toast("Bugun dam olish kuni"); }
  if (a === "ovReset") { delete S.over[k]; editShift = false; toast("Odatiy grafik"); }
  if (a === "blk") { const b = el.dataset.k; if (b === "sleep") return; D.done = D.done.includes(b) ? D.done.filter(x => x !== b) : [...D.done, b]; }
  if (a === "hab") { const i = +el.dataset.i; D.habits = D.habits.includes(i) ? D.habits.filter(x => x !== i) : [...D.habits, i]; }
  if (a === "w+") { D.water++; if (D.water === S.settings.waterGoal) toast("Suv me'yori bajarildi 💧"); }
  if (a === "w-") D.water = Math.max(0, D.water - 1);
  if (a === "ex") { D.ex[el.dataset.id] = !D.ex[el.dataset.id]; const wk = workoutFor(sel.getDay()); if (wk.ex.every(x => D.ex[x.id])) toast("Mashg'ulot yakunlandi 💪"); }
  if (a === "lesson") {
    const id = el.dataset.c, tk = dkey(new Date()); S.prog[id] = (S.prog[id] || 0) + 1;
    S.learn[tk] = [...(S.learn[tk] || []), id]; toast(`${COURSES[id].short}: dars yakunlandi 🎓`);
  }
  if (a === "wday") { const i = +el.dataset.i, w = S.settings.workDays; S.settings.workDays = w.includes(i) ? w.filter(x => x !== i) : [...w, i]; }
  if (a === "gmode") S.settings.gymMode = el.dataset.v;
  if (a === "bw") { const v = parseFloat($("#bw").value); if (!(v > 20 && v < 300)) { toast("Vaznni kg da kiriting"); return; } const tk = dkey(new Date()); S.body = S.body.filter(b => b.d !== tk); S.body.push({ d: tk, w: v }); toast("Vazn yozildi"); }
  if (a === "bh") { const v = parseFloat($("#bh").value); if (!(v > 100 && v < 250)) { toast("Bo'yni sm da kiriting"); return; } const tk = dkey(new Date()); S.height = S.height.filter(b => b.d !== tk); S.height.push({ d: tk, h: v }); toast("Bo'y yozildi"); }
  if (a === "posture") { const td = day(dkey(new Date())); td.posture = !td.posture; if (td.posture) toast("Qad mashqi bajarildi +20 XP"); }
  if (a === "reset") { if (!confirm("Barcha ma'lumotlar o'chirilsinmi?")) return; S = fresh(); toast("Hammasi o'chirildi"); }
  const nr = rankOf(totalXP()); if (nr > (S.lastRank || 0)) setTimeout(() => toast(`🎖 Yangi unvon: ${RANKS[nr][0]}!`), 400); S.lastRank = nr;
  save(); render();
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.set) {
    const k = el.dataset.set; let v = el.value;
    if (el.type === "number") { v = parseFloat(v); if (isNaN(v)) return; }
    if (el.type === "time" && !v) return;
    S.settings[k] = v; save(); renderTop(); renderDial(); renderHero(); renderWeek(); toast("Saqlandi");
  }
  if (el.dataset.act === "kg") {
    const v = parseFloat(el.value), id = el.dataset.id, old = S.weights[id], tk = dkey(new Date());
    if (isNaN(v)) return;
    S.weights[id] = { w: v, d: tk, prev: old ? (old.d === tk ? old.prev : old.w) : null };
    save(); renderGym();
  }
});

/* ================= live clock ================= */
let lastMin = -1, lastDay = dkey(new Date());
function tick() {
  const n = new Date();
  if (dkey(n) !== lastDay) { if (dkey(sel) === lastDay) sel = new Date(); lastDay = dkey(n); render(); }
  renderHero(); timerTick();
  if (n.getMinutes() !== lastMin) { lastMin = n.getMinutes(); renderDial(); renderTop(); if (tab === "bugun" && !editShift) renderToday(); }
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(); });

/* ================= home-screen icon ================= */
(function () {
  try {
    const c = document.createElement("canvas"); c.width = c.height = 180; const x = c.getContext("2d");
    const g = x.createLinearGradient(0, 0, 180, 180); g.addColorStop(0, "#17231f"); g.addColorStop(1, "#0b110f");
    x.fillStyle = g; x.fillRect(0, 0, 180, 180);
    [["#2c3b45", -.5, .8], ["#d4af6a", .85, 1.3], ["#86b4c4", 1.35, 2.6], ["#d4806c", 2.65, 3.1], ["#c49bbb", 3.15, 3.6], ["#5fbf95", 3.65, 4.4]].forEach(([c2, a, b]) => { x.lineWidth = 18; x.strokeStyle = c2; x.beginPath(); x.arc(90, 90, 56, a - Math.PI / 2, b - Math.PI / 2); x.stroke(); });
    x.fillStyle = "#ecd49c"; x.beginPath(); x.arc(90 + 56 * Math.cos(1.1 - Math.PI / 2), 90 + 56 * Math.sin(1.1 - Math.PI / 2), 13, 0, 7); x.fill();
    const url = c.toDataURL("image/png"); $("#touchIcon").href = url;
    const m = { name: "Ritm", short_name: "Ritm", display: "standalone", background_color: "#0b110f", theme_color: "#0b110f", start_url: ".", icons: [{ src: url, sizes: "180x180", type: "image/png" }] };
    const l = document.createElement("link"); l.rel = "manifest"; l.href = URL.createObjectURL(new Blob([JSON.stringify(m)], { type: "application/json" })); document.head.appendChild(l);
  } catch (e) {}
})();

S.lastRank = S.lastRank ?? rankOf(totalXP());
render();
setInterval(tick, 1000);
requestAnimationFrame(animLoop);
</script>
</body>
